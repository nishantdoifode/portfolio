<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thank you for contacting Nishant Doifode">
  <title>Thank You — Nishant Doifode</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="media/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="media/favicon-16x16.png">
  <link rel="apple-touch-icon" href="media/apple-touch-icon.png">
  <link rel="manifest" href="media/site.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="theme-toggle" id="theme-toggle">
    <i class="fas fa-moon"></i>
  </div>

  <nav>
    <div class="nav-links">
      <a href="https://nishantportfoliomark2.netlify.app/#home"><i class="fas fa-home"></i><span>Home</span></a>
      <a href="https://nishantportfoliomark2.netlify.app/#projects"><i class="fas fa-code"></i><span>Work</span></a>
      <a href="https://nishantportfoliomark2.netlify.app/#skills"><i class="fas fa-layer-group"></i><span>Skills</span></a>
      <a href="https://nishantportfoliomark2.netlify.app/#about"><i class="fas fa-user"></i><span>About</span></a>
      <a href="https://nishantportfoliomark2.netlify.app/#contact"><i class="fas fa-envelope"></i><span>Contact</span></a>
    </div>
  </nav>

  <main id="main-content">
    <section class="section thank-you-section">
      <div class="container">
        <div class="thank-you-card">
          <div class="thank-you-icon">
            <i class="fas fa-paper-plane"></i>
          </div>
          <h1>Thanks for reaching out!</h1>
          <p>Your message has been sent successfully. I'll get back to you as soon as possible.</p>
          <a href="https://nishantportfoliomark2.netlify.app/" class="btn-resume">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Nishant Doifode. All rights reserved.</p>
  </footer>

  <script>
    // Theme toggle persistence
    const themeToggle = document.getElementById('theme-toggle');
    const icon = themeToggle ? themeToggle.querySelector('i') : null;

    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      if (icon) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
      }
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        if (icon) {
          icon.classList.toggle('fa-moon');
          icon.classList.toggle('fa-sun');
        }
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
      });
    }
  </script>
</body>
</html>
